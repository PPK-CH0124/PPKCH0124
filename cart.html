<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shopping Cart</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h2 {
  text-align: center;
}

.cart-item {
  background: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 10px;
}

.item-info {
  flex: 2;
}

.item-price {
  flex: 1;
  text-align: center;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 10px;
}

.quantity button {
  padding: 5px 10px;
  cursor: pointer;
}

.remove {
  color: red;
  cursor: pointer;
}

.summary {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-top: 20px;
}

.checkout {
  width: 100%;
  padding: 12px;
  background: orange;
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.clear {
  margin-top: 10px;
  background: red;
  color: white;
  border: none;
  padding: 10px;
  width: 100%;
}
</style>
</head>

<body>

<div class="container">

<h2>🛒 Shopping Cart</h2>

<div id="cart-list"></div>

<div class="summary">
  <h3 id="total">Total: RM 0.00</h3>
  <button class="checkout" onclick="checkout()">Checkout via WhatsApp</button>
  <button class="clear" onclick="clearCart()">Clear Cart</button>
</div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let cartList = document.getElementById("cart-list");

function renderCart() {
  cartList.innerHTML = "";
  let total = 0;

  cart.forEach((item, index) => {
    total += item.price * item.qty;

    cartList.innerHTML += `
      <div class="cart-item">
        <div class="item-info">
          <strong>${item.name}</strong>
        </div>

        <div class="item-price">
          RM ${item.price}
        </div>

        <div class="quantity">
          <button onclick="decreaseQty(${index})">−</button>
          <span>${item.qty}</span>
          <button onclick="increaseQty(${index})">+</button>
        </div>

        <div>
          RM ${(item.price * item.qty).toFixed(2)}
        </div>

        <div class="remove" onclick="removeItem(${index})">
          ❌
        </div>
      </div>
    `;
  });

  document.getElementById("total").innerText = "Total: RM " + total.toFixed(2);
}

function increaseQty(i) {
  cart[i].qty++;
  saveCart();
}

function decreaseQty(i) {
  if (cart[i].qty > 1) {
    cart[i].qty--;
  } else {
    cart.splice(i, 1);
  }
  saveCart();
}

function removeItem(i) {
  cart.splice(i, 1);
  saveCart();
}

function clearCart() {
  localStorage.removeItem("cart");
  cart = [];
  renderCart();
}

function saveCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function checkout() {
  if (cart.length === 0) {
    alert("Cart kosong!");
    return;
  }

  let msg = "Hi, saya nak order:\n\n";
  let total = 0;

  cart.forEach(item => {
    msg += `${item.name} x${item.qty} = RM ${(item.price * item.qty).toFixed(2)}\n`;
    total += item.price * item.qty;
  });

  msg += `\nTotal: RM ${total.toFixed(2)}`;
  msg += "\n\nNama:\nAlamat:";

  let phone = "60123456789"; // tukar nombor anda
  let url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;

  window.open(url, "_blank");
}

renderCart();
</script>

</body>
</html>
