<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shopping Cart</title>

<style>
body { font-family:Arial; background:#f5f5f5; margin:0; }

.container {
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* Back Button */
.back-btn {
  display:inline-block;
  margin-bottom:15px;
  padding:10px 15px;
  background:#2c5d50;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

/* Cart Item */
.cart-item {
  background:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}

.quantity {
  display:flex;
  align-items:center;
  gap:10px;
}

.quantity button {
  padding:5px 10px;
  cursor:pointer;
}

/* Summary */
.summary {
  background:white;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

.checkout {
  width:100%;
  padding:12px;
  background:orange;
  color:white;
  border:none;
  font-size:16px;
  margin-top:10px;
}

.clear {
  width:100%;
  padding:10px;
  background:red;
  color:white;
  border:none;
  margin-top:10px;
}

input, textarea {
  width:100%;
  padding:10px;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="container">

<!-- 🔙 BACK (CLEAR CART + GO HOME) -->
<button onclick="Back To Main()" class="back-btn">
⬅ Back to Main Page
</button>

<h2>🛒 Shopping Cart</h2>

<div id="cart-list"></div>

<div class="summary">

<h3 id="total">Total: RM 0.00</h3>

<h4>Customer Details</h4>
<input id="name" placeholder="Nama">
<input id="phone" placeholder="No Phone">
<textarea id="address" placeholder="Alamat"></textarea>

<button class="checkout" onclick="payNow()">💳 Pay Online (FPX)</button>
<button class="clear" onclick="clearCart()">Clear Cart</button>

</div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderCart() {
  let html = "";
  let total = 0;

  cart.forEach((item, i) => {
    total += item.price * item.qty;

    html += `
    <div class="cart-item">
      <div>${item.name}</div>

      <div>RM ${item.price}</div>

      <div class="quantity">
        <button onclick="minus(${i})">-</button>
        ${item.qty}
        <button onclick="plus(${i})">+</button>
      </div>

      <div>RM ${(item.price * item.qty).toFixed(2)}</div>

      <div onclick="removeItem(${i})" style="cursor:pointer;">❌</div>
    </div>
    `;
  });

  document.getElementById("cart-list").innerHTML = html;
  document.getElementById("total").innerText = "Total: RM " + total.toFixed(2);
}

function plus(i){ cart[i].qty++; save(); }
function minus(i){ cart[i].qty--; if(cart[i].qty<=0) cart.splice(i,1); save(); }
function removeItem(i){ cart.splice(i,1); save(); }

function save(){
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function clearCart(){
  localStorage.removeItem("cart");
  cart=[];
  renderCart();
}

/* 🔥 BACK FUNCTION (CLEAR + REDIRECT) */
function backToMain(){
  localStorage.removeItem("cart");
  window.location.href = "index.html";
}

function payNow(){
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let address = document.getElementById("address").value;

  if(!name || !phone || !address){
    alert("Sila isi semua maklumat!");
    return;
  }

  if(cart.length === 0){
    alert("Cart kosong!");
    return;
  }

  let paymentLink = "https://toyyibpay.com/your-bill-code";

  alert("Redirecting ke Online Banking...");
  window.location.href = paymentLink;
}

renderCart();
</script>

</body>
</html>
